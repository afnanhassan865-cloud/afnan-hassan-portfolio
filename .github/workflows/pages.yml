name: Deploy portfolios to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare both portfolio sites
        shell: bash
        run: |
          set -e
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

          VISUAL_URL='https://afnan-visual-ai-portfolio.stormy-hippo-7639.chatgpt.site/'
          MIRROR_ROOT='/tmp/visual-ai-mirror'
          HOST='afnan-visual-ai-portfolio.stormy-hippo-7639.chatgpt.site'

          mkdir -p "$MIRROR_ROOT" _site/visual-ai

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --directory-prefix="$MIRROR_ROOT" \
            "$VISUAL_URL" || true

          if [ -d "$MIRROR_ROOT/$HOST" ]; then
            cp -a "$MIRROR_ROOT/$HOST"/. _site/visual-ai/
          fi

          if [ ! -f _site/visual-ai/index.html ]; then
            curl -fL "$VISUAL_URL" -o _site/visual-ai/index.html
          fi

          find _site/visual-ai -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | \
            xargs -0 sed -i \
              -e 's#/assets/#assets/#g' \
              -e 's#/portfolio/#portfolio/#g' \
              -e 's#/Afnan-Hassan-Portfolio.pdf#Afnan-Hassan-Portfolio.pdf#g'

          # Convert the mirrored app into a GitHub-safe static interactive page.
          # The HTML already contains the full rendered portfolio, so remove the
          # Vinext/React hydration scripts that can stall on GitHub Pages and use a
          # tiny standalone script for scroll progress and reveal effects instead.
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('_site/visual-ai/index.html')
          s = p.read_text(encoding='utf-8')

          # Remove all application/RSC scripts and module preload links.
          s = re.sub(r'<script\b[^>]*>.*?</script>', '', s, flags=re.S | re.I)
          s = re.sub(r'<link\b[^>]*rel=["\']modulepreload["\'][^>]*>', '', s, flags=re.I)

          # Never let the loading overlay block the static page.
          s = s.replace('</head>', '<style>.loader{display:none!important}</style></head>')

          static_js = '''<script>
          (function(){
            function boot(){
              var main=document.querySelector('main');
              function update(){
                if(!main) return;
                var y=window.scrollY||0;
                var max=Math.max(document.body.scrollHeight-window.innerHeight,1);
                main.style.setProperty('--scroll',Math.min(y/850,1));
                main.style.setProperty('--progress',Math.min(y/max,1));
              }
              update();
              window.addEventListener('scroll',update,{passive:true});

              var targets=document.querySelectorAll('.reveal,.case-story,.skill-card');
              if('IntersectionObserver' in window){
                var obs=new IntersectionObserver(function(entries){
                  entries.forEach(function(entry){
                    if(entry.isIntersecting) entry.target.classList.add('in-view');
                  });
                },{threshold:.12});
                targets.forEach(function(el){obs.observe(el)});
              } else {
                targets.forEach(function(el){el.classList.add('in-view')});
              }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
            else boot();
          })();
          </script>'''

          if '</body>' in s:
              s = s.replace('</body>', static_js + '</body>', 1)
          else:
              s += static_js

          p.write_text(s, encoding='utf-8')
          PY

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/visual-ai/index.html
          test -s _site/visual-ai/portfolio/case-marketing.png
          grep -q '.loader{display:none!important}' _site/visual-ai/index.html
          grep -q 'IntersectionObserver' _site/visual-ai/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
