name: Deploy portfolios to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare both portfolio sites
        shell: bash
        run: |
          set -e
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

          VISUAL_URL='https://afnan-visual-ai-portfolio.stormy-hippo-7639.chatgpt.site/'
          MIRROR_ROOT='/tmp/visual-ai-mirror'
          HOST='afnan-visual-ai-portfolio.stormy-hippo-7639.chatgpt.site'

          mkdir -p "$MIRROR_ROOT" _site/visual-ai

          wget \
            --mirror \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --directory-prefix="$MIRROR_ROOT" \
            "$VISUAL_URL" || true

          if [ -d "$MIRROR_ROOT/$HOST" ]; then
            cp -a "$MIRROR_ROOT/$HOST"/. _site/visual-ai/
          fi

          if [ ! -f _site/visual-ai/index.html ]; then
            curl -fL "$VISUAL_URL" -o _site/visual-ai/index.html
          fi

          # The source app was built for the domain root. On GitHub Pages it lives
          # under /visual-ai/, so convert root-relative runtime/resource paths to
          # paths relative to that folder. This keeps JS hydration, images and the
          # PDF working from the nested route.
          find _site/visual-ai -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | \
            xargs -0 sed -i \
              -e 's#/assets/#assets/#g' \
              -e 's#/portfolio/#portfolio/#g' \
              -e 's#/Afnan-Hassan-Portfolio.pdf#Afnan-Hassan-Portfolio.pdf#g'

          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/visual-ai/index.html
          test -s _site/visual-ai/assets/index-DZ8ipKAn.js

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
